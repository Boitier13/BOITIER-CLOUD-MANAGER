# Candidat Windows pour les essais visuels, sans publication de release.
name: Essai interface Windows
on:
  push:
    branches: [arena/097a2eff-boitier-cloud-manager]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier l'application
        run: npm run verify:desktop
      - name: Construire l'installeur sans publication
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Conserver le candidat pour les essais
        uses: actions/upload-artifact@v4
        with:
          name: boitier-candidat-interface-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
