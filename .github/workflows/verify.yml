name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le binaire Electron n'est pas nécessaire pour vérifier : seuls les
      # modules Node et les types sont utilisés.
      - name: Installer les dépendances
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Types de l'interface
        run: npm run typecheck

      - name: Types du processus principal
        run: npm run desktop:typecheck

      - name: Build de l'interface
        run: npm run build

      - name: Build du processus principal
        run: npm run desktop:build

      - name: Google Drive (faux serveur local, 30 contrôles)
        run: npm run desktop:test

      - name: Chargement de la fenêtre en file://
        run: npm run desktop:paths

      - name: Contenu de l'application empaquetée
        run: npm run desktop:package-test

  update-launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vérifie la création d'un processus réel depuis le worker sur Windows,
      # sans installer ni fermer une application.
      - name: Lanceur de mise à jour Windows
        run: node desktop/test/update-launcher.mjs
